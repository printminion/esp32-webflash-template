; ============================================================
; esp32-webflash-template — PlatformIO configuration
; Defines release and debug environments for each target board
; ============================================================

[platformio]
default_envs =
    seeed_xiao_esp32c3
    seeed_xiao_esp32s3
    seeed_xiao_esp32c6
    generic_esp32

; ------------------------------------------------------------
; Shared settings inherited by all environments
; ------------------------------------------------------------
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    ayushsharma82/ElegantOTA @ ^3.1.0
    bblanchon/ArduinoJson @ ^7.3.1

build_flags =
    -D FIRMWARE_VERSION='"dev"'
    -D PROJECT_NAME='"esp32-webflash-template"'
    -D ARDUINO_LOOP_STACK_SIZE=8192

; ------------------------------------------------------------
; Seeed XIAO ESP32-C3  —  release
; ------------------------------------------------------------
[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32C3
    -D BOARD_NAME='"Seeed XIAO ESP32-C3"'
    -D NDEBUG
    -I boards/seeed_xiao_esp32c3

; ------------------------------------------------------------
; Seeed XIAO ESP32-C3  —  debug
; ------------------------------------------------------------
[env:seeed_xiao_esp32c3-debug]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32C3
    -D BOARD_NAME='"Seeed XIAO ESP32-C3 (debug)"'
    -D DEBUG_BUILD
    -D CORE_DEBUG_LEVEL=4
    -I boards/seeed_xiao_esp32c3
build_type = debug

; ------------------------------------------------------------
; Seeed XIAO ESP32-S3  —  release
; ------------------------------------------------------------
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_NAME='"Seeed XIAO ESP32-S3"'
    -D NDEBUG
    -I boards/seeed_xiao_esp32s3

; ------------------------------------------------------------
; Seeed XIAO ESP32-S3  —  debug
; ------------------------------------------------------------
[env:seeed_xiao_esp32s3-debug]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_NAME='"Seeed XIAO ESP32-S3 (debug)"'
    -D DEBUG_BUILD
    -D CORE_DEBUG_LEVEL=4
    -I boards/seeed_xiao_esp32s3
build_type = debug

; ------------------------------------------------------------
; Seeed XIAO ESP32-C6  —  release
; ESP32-C6 requires the pioarduino fork of platform-espressif32
; because the official PlatformIO platform does not yet support
; Arduino framework on this chip.
; ------------------------------------------------------------
[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32C6
    -D BOARD_NAME='"Seeed XIAO ESP32-C6"'
    -D NDEBUG
    -I boards/seeed_xiao_esp32c6

; ------------------------------------------------------------
; Seeed XIAO ESP32-C6  —  debug
; ------------------------------------------------------------
[env:seeed_xiao_esp32c6-debug]
board = seeed_xiao_esp32c6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32C6
    -D BOARD_NAME='"Seeed XIAO ESP32-C6 (debug)"'
    -D DEBUG_BUILD
    -D CORE_DEBUG_LEVEL=4
    -I boards/seeed_xiao_esp32c6
build_type = debug

; ------------------------------------------------------------
; Generic ESP32  —  release
; ------------------------------------------------------------
[env:generic_esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOARD_GENERIC_ESP32
    -D BOARD_NAME='"Generic ESP32"'
    -D NDEBUG
    -I boards/generic_esp32

; ------------------------------------------------------------
; Generic ESP32  —  debug
; ------------------------------------------------------------
[env:generic_esp32-debug]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOARD_GENERIC_ESP32
    -D BOARD_NAME='"Generic ESP32 (debug)"'
    -D DEBUG_BUILD
    -D CORE_DEBUG_LEVEL=4
    -I boards/generic_esp32
build_type = debug

# ============================================================
# dev.yml
# Triggered on pushes to the dev branch.
# Builds all release environments, deploys binaries and an
# updated manifest to the dev/ channel on GitHub Pages.
# ============================================================

name: Dev build

on:
  push:
    branches:
      - dev

jobs:
  setup:
    name: Read board matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build matrix from project.json
        id: read
        run: |
          matrix=$(jq -c '[.boards[] | {
            environment:       .id,
            chip:              .chip,
            bootloader_offset: .bootloaderOffset,
            requires_uv:       .requiresUv
          }]' project.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Pre-install uv (required by pioarduino platform for ESP32-C6)
        if: matrix.requires_uv == true
        run: pip install uv

      - name: Compute version string
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Inject firmware version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/-D FIRMWARE_VERSION='\"dev\"'/-D FIRMWARE_VERSION='\"${VERSION}\"'/" platformio.ini

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Create merged firmware binary
        run: |
          mkdir -p firmware
          VERSION="${{ steps.version.outputs.version }}"
          esptool.py --chip ${{ matrix.chip }} merge_bin \
            -o firmware/firmware-${{ matrix.environment }}-${VERSION}.bin \
            ${{ matrix.bootloader_offset }} .pio/build/${{ matrix.environment }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.environment }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.environment }}/firmware.bin

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: firmware-${{ matrix.environment }}
          path: firmware/*.bin
          retention-days: 3

  deploy:
    name: Deploy dev channel
    runs-on: ubuntu-latest
    needs: [setup, build]

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Compute version string
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4.2.0
        with:
          path: firmware
          merge-multiple: true

      - name: List firmware files
        run: ls -lh firmware/

      - name: Generate dev manifest and copy firmware
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROJECT_NAME=$(jq -r '.project.name' project.json)
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dev"
          mkdir -p docs/dev

          BUILDS=$(jq -c --arg bu "$BASE_URL" --arg v "$VERSION" \
            '[.boards[] | {chipFamily, board: .name,
              parts: [{path: ($bu+"/firmware-"+.id+"-"+$v+".bin"), offset: 0}]
            }]' project.json)

          jq -n --arg name "$PROJECT_NAME" --arg version "$VERSION" \
                 --arg channel "dev" --argjson builds "$BUILDS" \
            '{name:$name,version:$version,channel:$channel,builds:$builds}' \
            > docs/dev/manifest.json

          # Copy firmware binaries into docs/dev for Pages hosting
          cp firmware/*.bin docs/dev/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false

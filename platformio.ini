; ============================================================
; esp32-webflash-template — PlatformIO configuration
; AUTO-GENERATED from project.json — do not edit by hand.
; Re-generate with: python scripts/generate_platformio.py
; ============================================================

[platformio]
default_envs =
    seeed_xiao_esp32c3
    seeed_xiao_esp32s3
    seeed_xiao_esp32c6
    generic_esp32
    seeed_xiao_esp32c3-wifi
    seeed_xiao_esp32s3-wifi
    seeed_xiao_esp32c6-wifi
    generic_esp32-wifi

; ------------------------------------------------------------
; Shared settings inherited by all environments
; ------------------------------------------------------------
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    ayushsharma82/ElegantOTA @ ^3.1.0
    bblanchon/ArduinoJson @ ^7.3.1

build_flags =
    -D FIRMWARE_VERSION='"dev"'
    -D PROJECT_NAME='"esp32-webflash-template"'
    -D ARDUINO_LOOP_STACK_SIZE=8192

; ────────────────────────────────────────────────────────────
; Seeed XIAO ESP32-C3  —  release
; ────────────────────────────────────────────────────────────
[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32C3
    -D BOARD_NAME='"Seeed XIAO ESP32-C3"'
    -D VARIANT_NO_WIFI
    -D NDEBUG
    -I boards/seeed_xiao_esp32c3

; ────────────────────────────────────────────────────────────
; Seeed XIAO ESP32-C3  —  debug
; ────────────────────────────────────────────────────────────
[env:seeed_xiao_esp32c3-debug]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32C3
    -D BOARD_NAME='"Seeed XIAO ESP32-C3 (debug)"'
    -D VARIANT_NO_WIFI
    -D DEBUG_BUILD
    -D CORE_DEBUG_LEVEL=4
    -I boards/seeed_xiao_esp32c3
build_type = debug

; ────────────────────────────────────────────────────────────
; Seeed XIAO ESP32-S3  —  release
; ────────────────────────────────────────────────────────────
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
board_build.partitions = partitions_esp32s3_8mb.csv
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_NAME='"Seeed XIAO ESP32-S3"'
    -D VARIANT_NO_WIFI
    -D NDEBUG
    -I boards/seeed_xiao_esp32s3

; ────────────────────────────────────────────────────────────
; Seeed XIAO ESP32-S3  —  debug
; ────────────────────────────────────────────────────────────
[env:seeed_xiao_esp32s3-debug]
board = seeed_xiao_esp32s3
board_build.partitions = partitions_esp32s3_8mb.csv
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_NAME='"Seeed XIAO ESP32-S3 (debug)"'
    -D VARIANT_NO_WIFI
    -D DEBUG_BUILD
    -D CORE_DEBUG_LEVEL=4
    -I boards/seeed_xiao_esp32s3
build_type = debug


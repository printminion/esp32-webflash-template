# ============================================================
# dev.yml
# Triggered on pushes to the dev branch.
# Builds all release environments, deploys binaries and an
# updated manifest to the dev/ channel on GitHub Pages.
# ============================================================

name: Dev build

on:
  push:
    branches:
      - dev

jobs:
  setup:
    name: Read board matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build matrix from project.json
        id: read
        run: |
          matrix=$(jq -c '[.boards[] | {
            environment:       .id,
            chip:              .chip,
            bootloader_offset: .bootloaderOffset,
            requires_uv:       .requiresUv
          }]' project.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
      - name: Compute version string
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Pre-install uv (required by pioarduino platform for ESP32-C6)
        if: matrix.requires_uv == true
        run: pip install uv

      - name: Inject firmware version
        run: |
          # Use Python for safe in-place replacement — avoids sed delimiter conflicts
          # when VERSION contains '/', '&', or other sed-special characters.
          python - <<'EOF'
          import re
          version = "${{ needs.setup.outputs.version }}"
          with open("platformio.ini", "r") as f:
              content = f.read()
          replacement = "-D FIRMWARE_VERSION='\"" + version + "\"'"
          content = re.sub(
              r"-D FIRMWARE_VERSION='\"[^\"]*\"'",
              lambda _: replacement,
              content,
          )
          with open("platformio.ini", "w") as f:
              f.write(content)
          EOF

      - name: Set WiFi AP build flags
        # Use WIFI_AP_PASSWORD secret if configured; otherwise fall back to WIFI_AP_OPEN=1.
        env:
          WIFI_AP_PASSWORD_SECRET: ${{ secrets.WIFI_AP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os
          pw = os.environ.get('WIFI_AP_PASSWORD_SECRET', '')
          github_env = os.environ['GITHUB_ENV']
          if pw:
              # Escape only backslashes and double-quotes for the C string literal.
              # Avoids shell quoting (%q) which would alter the secret's actual bytes.
              c_escaped = pw.replace('\\', '\\\\').replace('"', '\\"')
              flag = "-D WIFI_AP_PASSWORD='\"" + c_escaped + "\"'"
              with open(github_env, 'a') as f:
                  f.write("PLATFORMIO_BUILD_FLAGS=" + flag + "\n")
          else:
              with open(github_env, 'a') as f:
                  f.write("PLATFORMIO_BUILD_FLAGS=-D WIFI_AP_OPEN=1\n")
          EOF

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Create merged firmware binary
        run: |
          mkdir -p firmware
          VERSION="${{ needs.setup.outputs.version }}"
          python -m esptool --chip ${{ matrix.chip }} merge_bin \
            -o firmware/firmware-${{ matrix.environment }}-${VERSION}.bin \
            ${{ matrix.bootloader_offset }} .pio/build/${{ matrix.environment }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.environment }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.environment }}/firmware.bin

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: firmware-${{ matrix.environment }}
          path: firmware/*.bin
          retention-days: 3

  deploy:
    name: Deploy dev channel
    runs-on: ubuntu-latest
    needs: [setup, build]

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4.2.0
        with:
          path: firmware
          merge-multiple: true

      - name: List firmware files
        run: ls -lh firmware/

      - name: Generate dev manifest and copy firmware
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          PROJECT_NAME=$(jq -r '.project.name' project.json)
          BASE_URL="$(jq -r '.installer.baseUrl' project.json)/dev"
          mkdir -p docs/dev

          BUILDS=$(jq -c --arg bu "$BASE_URL" --arg v "$VERSION" \
            '[.boards[] | {chipFamily, board: .name,
              parts: [{path: ($bu+"/firmware-"+.id+"-"+$v+".bin"), offset: 0}]
            }]' project.json)

          jq -n --arg name "$PROJECT_NAME" --arg version "$VERSION" \
                 --arg channel "dev" --argjson builds "$BUILDS" \
            '{name:$name,version:$version,channel:$channel,builds:$builds}' \
            > docs/dev/manifest.json

          # Copy firmware binaries into docs/dev for Pages hosting
          cp firmware/*.bin docs/dev/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dev
          destination_dir: dev
          keep_files: true

      - name: Stage root web installer files
        run: |
          mkdir -p _deploy_root
          cp docs/index.html _deploy_root/
          cp docs/boards_config.js _deploy_root/

      - name: Deploy web installer to GitHub Pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy_root
          destination_dir: .
          keep_files: true

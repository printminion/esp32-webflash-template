# ============================================================
# release.yml
# Triggered on version tags (v*).
# Builds all release PlatformIO environments, creates a
# GitHub Release and attaches firmware .bin files as assets.
# Also updates the web installer manifest and deploys to
# GitHub Pages.
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  setup:
    name: Read board matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build matrix from project.json
        id: read
        run: |
          matrix=$(jq -c '[.boards[] | {
            environment:       .id,
            chip:              .chip,
            bootloader_offset: .bootloaderOffset,
            requires_uv:       .requiresUv
          }]' project.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Pre-install uv (required by pioarduino platform for ESP32-C6)
        if: matrix.requires_uv == true
        run: pip install uv

      - name: Inject firmware version
        env:
          INJECT_VERSION: ${{ github.ref_name }}
        run: |
          # Pass the version via an env var so quotes/backslashes in the value
          # never break the Python string literal or cause injection issues.
          python - <<'EOF'
          import os, re
          version = os.environ["INJECT_VERSION"]
          with open("platformio.ini", "r") as f:
              content = f.read()
          replacement = "-D FIRMWARE_VERSION='\"" + version + "\"'"
          content, count = re.subn(
              r"-D FIRMWARE_VERSION='\"[^\"]*\"'",
              lambda _: replacement,
              content,
          )
          if count == 0:
              raise RuntimeError("FIRMWARE_VERSION flag not found in platformio.ini — version injection failed")
          with open("platformio.ini", "w") as f:
              f.write(content)
          EOF

      - name: Set WiFi AP build flags
        # WiFi AP policy for release builds (requires one of the following):
        #   1. Set the WIFI_AP_PASSWORD repository secret → password-protected captive portal.
        #   2. Set the WIFI_AP_ALLOW_OPEN_RELEASE repository variable to "1" → open AP (not for production).
        # If neither is set the job fails so open-AP firmware is never published by accident.
        env:
          WIFI_AP_PASSWORD_SECRET: ${{ secrets.WIFI_AP_PASSWORD }}
          WIFI_AP_ALLOW_OPEN: ${{ vars.WIFI_AP_ALLOW_OPEN_RELEASE }}
        run: |
          python3 - <<'EOF'
          import os, sys, shlex, uuid
          pw = os.environ.get('WIFI_AP_PASSWORD_SECRET', '')
          allow_open = os.environ.get('WIFI_AP_ALLOW_OPEN', '')
          github_env = os.environ['GITHUB_ENV']
          if pw:
              # Escape backslashes and double-quotes for the C string literal.
              # Also encode newlines/carriage-returns so the flag stays single-line.
              c_escaped = (pw.replace('\\', '\\\\')
                             .replace('"', '\\"')
                             .replace('\n', '\\n')
                             .replace('\r', '\\r'))
              # Use shlex.quote on the C string literal so single-quotes in the
              # password don't break PlatformIO's shlex-style flag parsing.
              c_literal = '"' + c_escaped + '"'
              flag = "-D WIFI_AP_PASSWORD=" + shlex.quote(c_literal)
          elif allow_open == '1':
              flag = "-D WIFI_AP_OPEN=1"
          else:
              print("::error::Set the WIFI_AP_PASSWORD secret (recommended) or the WIFI_AP_ALLOW_OPEN_RELEASE variable to '1' before releasing.")
              sys.exit(1)
          # Use GITHUB_ENV multiline syntax so any residual newlines in the value
          # don't truncate or corrupt the env file.
          pio_flags_delimiter = 'EOF_PIO_FLAGS_' + uuid.uuid4().hex
          with open(github_env, 'a') as f:
              f.write(f"PLATFORMIO_BUILD_FLAGS<<{pio_flags_delimiter}\n{flag}\n{pio_flags_delimiter}\n")
          EOF

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Create merged firmware binary
        run: |
          # Merge bootloader + partition table + app into a single binary flashable at offset 0.
          # This is required for ESP Web Tools — flashing only the app binary (offset 0x10000)
          # at offset 0 overwrites the bootloader and causes a crash-loop on next boot.
          mkdir -p firmware
          python -m esptool --chip ${{ matrix.chip }} merge_bin \
            -o firmware/firmware-${{ matrix.environment }}-${{ github.ref_name }}.bin \
            ${{ matrix.bootloader_offset }} .pio/build/${{ matrix.environment }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.environment }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.environment }}/firmware.bin

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: firmware-${{ matrix.environment }}
          path: firmware/*.bin
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, build]

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch tag commit
        # The checkout above is shallow (fetch-depth: 1) and targets main.
        # github.sha is the tagged commit, which may not be in the shallow clone.
        # Fetch it explicitly so git show can access the tag's tree.
        run: git fetch origin ${{ github.sha }} --depth=1

      - name: Restore project.json from tag commit
        # Manifests are generated from project.json; use the tag's copy (not
        # main's) so the board list always matches the binaries that were built.
        run: git show ${{ github.sha }}:project.json > project.json

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4.2.0
        with:
          path: firmware
          merge-multiple: true

      - name: List firmware files
        run: ls -lh firmware/

      - name: Copy firmware to docs for CORS-safe GitHub Pages hosting
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p docs/firmware/${VERSION}
          cp firmware/*.bin docs/firmware/${VERSION}/

      - name: Generate manifest.json and version.json
        run: |
          VERSION="${{ github.ref_name }}"
          PROJECT_NAME=$(jq -r '.project.name' project.json)
          # manifest.json: served by the browser — must use GitHub Pages URLs (CORS-enabled).
          # Derive base URL from installer.baseUrl in project.json so forks/custom domains work.
          INSTALLER_BASE=$(jq -r '.installer.baseUrl | rtrimstr("/")' project.json)
          PAGES_URL="${INSTALLER_BASE}/firmware/${VERSION}"
          # version.json: fetched by firmware via esp_https_ota — GitHub Releases URLs are fine
          RELEASES_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}"

          BUILDS=$(jq -c --arg pu "$PAGES_URL" --arg v "$VERSION" \
            '[.boards[] | {chipFamily, board: .name,
              parts: [{path: ($pu+"/firmware-"+.id+"-"+$v+".bin"), offset: 0}]
            }]' project.json)

          jq -n --arg name "$PROJECT_NAME" --arg version "$VERSION" \
                 --arg channel "release" --argjson builds "$BUILDS" \
            '{name:$name,version:$version,channel:$channel,builds:$builds}' \
            > docs/manifest.json

          BOARDS_JSON=$(jq -c --arg u "$RELEASES_URL" --arg v "$VERSION" \
            '[.boards[] | {key:.name, value:($u+"/firmware-"+.id+"-"+$v+".bin")}] | from_entries' \
            project.json)

          jq -n --arg version "$VERSION" --argjson boards "$BOARDS_JSON" \
            '{version:$version,boards:$boards}' \
            > docs/version.json

          # Per-board version files: each board gets its own tiny file with only
          # "version" and "url" so the ESP32 downloads a fixed ~120-byte payload
          # regardless of how many boards exist in total.
          mkdir -p docs/version
          for board in $(jq -r '.boards[].id' project.json); do
            fw_url="${RELEASES_URL}/firmware-${board}-${VERSION}.bin"
            jq -n --arg v "$VERSION" --arg u "$fw_url" \
              '{"version":$v,"url":$u}' > "docs/version/${board}.json"
          done

      - name: Generate boards_config.js
        run: python scripts/generate_boards_config.py

      - name: Commit updated manifests and boards config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/manifest.json docs/version.json docs/version/ docs/boards_config.js
          git diff --staged --quiet || git commit -m "chore: update manifests for ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Generate release notes
        run: |
          VERSION="${{ github.ref_name }}"
          PROJECT_NAME=$(jq -r '.project.name' project.json)
          PAGES_URL="$(jq -r '.installer.baseUrl | rtrimstr("/")' project.json)/"
          {
            echo "## ${PROJECT_NAME} ${VERSION}"
            echo ""
            echo "### Flash via web installer"
            echo "👉 ${PAGES_URL}"
            echo ""
            echo "### Supported boards"
            echo "| Board | Firmware file |"
            echo "|---|---|"
            jq -r --arg v "$VERSION" \
              '.boards[] | "| \(.name) | `firmware-\(.id)-\($v).bin` |"' \
              project.json
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: firmware/*.bin
          draft: false
          prerelease: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: .
          keep_files: true
